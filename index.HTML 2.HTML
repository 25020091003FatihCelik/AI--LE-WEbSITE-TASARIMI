<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatih Çelik | Frontend Developer</title>

<style>
:root {
    --bg: #0a0a0a;
    --text: #ffffff;
    --neon: #00f7ff;
    --neon2: #ff00ff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
}

/* NAVBAR */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
@keyframes spin {
    100% { transform: rotate(360deg); }
}

/* SECTION */
.section {
    padding: 100px 20px;
    opacity: 0;
    transform: translateY(50px);
    transition: 0.6s;
}

.section.show {
    opacity: 1;
    transform: translateY(0);
}

/* MOUSE EFFECT */
.cursor {
    position: fixed;
    width: 10px;
    height: 10px;
    background: var(--neon);
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
}

/* WHATSAPP */
.whatsapp {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    font-size: 40px;
}

/* RESPONSIVE */
@media(max-width:768px) {
    .typing { font-size: 1.5rem; }
}
</style>
</head>

<body>

<div class="cursor"></div>

<nav class="navbar">
    <div>Fatih Çelik</div>
    <div>
        <a href="#home">Anasayfa</a>
        <a href="#about">Hakkımda</a>
        <a href="#projects">Projeler</a>
        <a href="#contact">İletişim</a>
    </div>
</nav>

<section class="hero" id="home">
    <div class="typing">Frontend Developer | Modern Web Çözümleri</div>
    <button class="btn" onclick="loadHome()">Anasayfa Yükle</button>
    <div class="spinner" id="spinner"></div>
</section>

<section class="section" id="about">Hakkımda</section>
<section class="section" id="projects">Projeler</section>
<section class="section" id="contact">İletişim</section>

<div class="whatsapp" id="wp">📱</div>

<script>

// Spinner
function loadHome(){
    let spinner = document.getElementById('spinner');
    spinner.style.display = 'block';
    setTimeout(()=>{
        spinner.style.display = 'none';
        alert('Yüklendi');
    },2000);
}

// Scroll reveal
window.addEventListener('scroll', () => {
    document.querySelectorAll('.section').forEach(sec => {
        const top = sec.getBoundingClientRect().top;
        if(top < window.innerHeight - 100){
            sec.classList.add('show');
        }
    });

    // WhatsApp show
    if(window.scrollY > document.body.scrollHeight * 0.7){
        document.getElementById('wp').style.display = 'block';
    }
});

// Mouse effect
const cursor = document.querySelector('.cursor');
document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
});

</script>

</body>
</html>
